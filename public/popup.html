<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Suno Lyrics Exporter</title>
    <style>
      html { color-scheme: dark; }
      body { margin: 0; width: 280px; background: #111114; color: #f7f7f8; font: 13px/1.45 system-ui, sans-serif; }
      main { padding: 16px; }
      h1 { margin: 0 0 8px; font-size: 15px; }
      p { margin: 0 0 14px; color: #aaaab2; }
      button { width: 100%; border: 0; border-radius: 9px; padding: 10px 12px; background: #7c3aed; color: white; font-weight: 700; cursor: pointer; }
      small { display: block; margin-top: 12px; color: #777781; }
    </style>
  </head>
  <body>
    <main>
      <h1>Suno Lyrics Exporter</h1>
      <p>Open a Suno song, then use the Export Lyrics button on the page.</p>
      <button id="open-panel" type="button">Open exporter</button>
      <small>Unofficial extension. Your session token stays in the browser.</small>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
